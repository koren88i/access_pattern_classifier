name: elastic_analytics
seed: 21
target:
  platform: elasticsearch
  system_id: fraud-service
  customer_id: acme
  database_or_index: transactions
time_range:
  start: "2026-04-30T00:00:00Z"
  end: "2026-05-01T00:00:00Z"
events: 100
responses:
  latency_ms: { distribution: normal, mean: 220, stddev: 50, min: 60, max: 700 }
  response_bytes: { distribution: uniform, min: 200000, max: 600000 }
  result_count: { distribution: uniform, min: 100, max: 300 }
query_shapes:
  - name: fraud_dashboard
    share: 100
    primitives: [key_lookup, time_series, range_lookup, multi_filter, aggregation]
