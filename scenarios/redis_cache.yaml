name: redis_cache
seed: 11
target:
  platform: redis
  system_id: session-api
  customer_id: acme
  database_or_index: cache
time_range:
  start: "2026-04-30T00:00:00Z"
  end: "2026-05-01T00:00:00Z"
events: 100
responses:
  latency_ms: { distribution: normal, mean: 8, stddev: 2, min: 1, max: 30 }
  response_bytes: { distribution: uniform, min: 100, max: 2000 }
  result_count: { distribution: fixed, value: 1 }
query_shapes:
  - name: setex_session
    share: 100
    primitives: [key_lookup, point_write, ttl_or_expire_usage]
