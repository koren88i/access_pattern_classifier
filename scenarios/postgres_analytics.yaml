name: postgres_analytics
seed: 7
target:
  platform: postgres
  system_id: reporting-api
  customer_id: acme
  database_or_index: orders
time_range:
  start: "2026-04-30T00:00:00Z"
  end: "2026-05-01T00:00:00Z"
events: 100
responses:
  latency_ms: { distribution: normal, mean: 1100, stddev: 150, min: 300, max: 2000 }
  response_bytes: { distribution: uniform, min: 700000, max: 1000000 }
  result_count: { distribution: uniform, min: 1200, max: 2200 }
query_shapes:
  - name: dashboard_rollup
    share: 100
    primitives: [time_series, range_lookup, multi_filter, aggregation, sort_paginate, scan]
