      multi_filter: 0.10
      template_stability: 0.20
      request_rate: 0.10
      p95_latency_pressure: 0.05
    penalties:
      text_search: -0.30
      vector_search: -0.30
      geo_search: -0.15

  search_text:
    score:
      text_search: 0.80
      sort_paginate: 0.10
      key_lookup: 0.05
