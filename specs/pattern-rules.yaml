  oltp:
    score:
      key_lookup: 0.30
      point_write: 0.25
      update_write: 0.15
      low_latency: 0.20
      template_stability: 0.10
    penalties:
      aggregation: -0.25
      scan: -0.25
      text_search: -0.20

  ad_hoc_analytics:
    score:
      scan: 0.30
      aggregation: 0.25
      low_template_stability: 0.30
      large_result: 0.15
